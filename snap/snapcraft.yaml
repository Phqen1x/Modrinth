name: modrinth
base: core24
version: '0.13.24'
title: Modrinth
summary: The official Modrinth launcher for Minecraft modpacks
description: |
  Modrinth App is the official launcher from Modrinth, letting you
  easily browse, install, and manage Minecraft modpacks and mods
  from the Modrinth platform.
website: https://modrinth.com/
issues: https://github.com/Phqen1x/Modrinth/issues
contact: https://github.com/Phqen1x/Modrinth/issues
source-code: https://github.com/Phqen1x/Modrinth
license: Proprietary
grade: stable
confinement: strict

platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]

plugs:
  browser-support:
    allow-sandbox: false

parts:
  modrinth-app:
    plugin: dump
    source: modrinth-app.deb
    source-type: deb
    # ModrinthApp uses the native_dialog crate to pop up a GUI message box
    # whenever Tauri fails to start (corrupt webview, missing GPU driver,
    # etc). On Linux that crate shells out to zenity, kdialog, or yad — none
    # of which exist inside this strictly-confined snap. With all three
    # missing, native_dialog itself returns Err(MissingDep), and main.rs
    # unwraps that result, so the app panics with "MissingDep" instead of
    # showing (or even logging) the real initialization error. Staging
    # zenity gives native_dialog a backend to find on $SNAP/usr/bin, so a
    # real startup failure surfaces its actual error message instead of
    # this unrelated crash.
    stage-packages:
      - zenity
    override-build: |
      craftctl default
      # Rename desktop file — the space in the original name causes issues with
      # snapd's desktop file installation
      mv "$CRAFT_PART_INSTALL/usr/share/applications/Modrinth App.desktop" \
         "$CRAFT_PART_INSTALL/usr/share/applications/modrinth-app.desktop"
      # Patch icon to absolute snap path; snapd expands ${SNAP} in desktop files
      sed -i 's|^Icon=.*|Icon=${SNAP}/usr/share/icons/hicolor/256x256@2/apps/ModrinthApp.png|' \
         "$CRAFT_PART_INSTALL/usr/share/applications/modrinth-app.desktop"
      # Neuter the in-app updater — it can't work under strict confinement, so the
      # "Update" button is a dead end. Tauri validates the updater endpoint's URL
      # scheme at config-deserialization time, before any network call, and
      # rejects anything but https ("the configured updater endpoint must use a
      # secure protocol like `https`") — so corrupting the scheme itself (e.g.
      # https -> httpx) crashes startup with PluginInitialization instead of
      # disabling the updater. Instead, keep the https scheme but repoint the
      # host at the RFC 2606 reserved .invalid TLD, which never resolves: the
      # scheme check passes, the later network check fails, and Modrinth's
      # updater_impl.rs treats a failed check as a no-op.
      # Must be an in-place, same-length edit so the ELF stays valid.
      bin="$CRAFT_PART_INSTALL/usr/bin/ModrinthApp"
      old='https://launcher-files.modrinth.com/updates.json'
      new='https://launcher-files.modrinth.invalid/upd.json'
      [ "${#old}" -eq "${#new}" ] || { echo "replacement length mismatch — would corrupt the ELF"; exit 1; }
      grep -q "$old" "$bin" || { echo "updater endpoint not found — Modrinth changed it"; exit 1; }
      perl -0777 -pi -e "s{\Q$old\E}{$new}g" "$bin"

  launcher:
    plugin: dump
    source: snap/local
    organize:
      launcher: bin/launcher
      xdg-open: bin/xdg-open

apps:
  modrinth:
    command: usr/bin/ModrinthApp
    extensions: [gnome]
    command-chain:
      - bin/launcher
    desktop: usr/share/applications/modrinth-app.desktop
    environment:
      HOME: $SNAP_USER_COMMON
      TMPDIR: $XDG_RUNTIME_DIR
    plugs:
      - audio-playback
      - browser-support
      - home
      - network
      - network-bind
      - network-status
      - opengl
