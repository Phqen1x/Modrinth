name: modrinth
base: core26
version: '0.23.1'
title: Modrinth
summary: The official Modrinth launcher for Minecraft modpacks
description: |
  Modrinth App is the official launcher from Modrinth, letting you
  easily browse, install, and manage Minecraft modpacks and mods
  from the Modrinth platform.
website: https://modrinth.com/
issues: https://github.com/Phqen1x/Modrinth/issues
contact: https://github.com/Phqen1x/Modrinth/issues
source-code: https://github.com/Phqen1x/Modrinth
license: GPL-3.0-only
grade: stable
confinement: strict

platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]

plugs:
  browser-support:
    allow-sandbox: false

parts:
  modrinth-app:
    plugin: nil
    source: https://github.com/modrinth/code.git
    source-tag: v0.23.1
    source-depth: 1
    build-snaps:
      - node/24/stable
      - rustup
    build-packages:
      - build-essential
      - jq
      - openjdk-17-jdk-headless
      - pkg-config
    # ModrinthApp uses the native_dialog crate to pop up a GUI message box
    # whenever Tauri fails to start (corrupt webview, missing GPU driver,
    # etc). On Linux that crate shells out to zenity, kdialog, or yad — none
    # of which exist inside this strictly-confined snap. With all three
    # missing, native_dialog itself returns Err(MissingDep), and main.rs
    # unwraps that result, so the app panics with "MissingDep" instead of
    # showing (or even logging) the real initialization error. Staging
    # zenity gives native_dialog a backend to find on $SNAP/usr/bin, so a
    # real startup failure surfaces its actual error message instead of
    # this unrelated crash.
    stage-packages:
      - zenity
    override-build: |
      version="$(craftctl get version)"
      tag="$(git describe --tags --exact-match)"
      [ "$tag" = "v$version" ] || { echo "version $version doesn't match source-tag $tag"; exit 1; }

      for patch in "$CRAFT_PROJECT_DIR"/snap/local/patches/*.patch; do
        git apply "$patch"
      done

      # Mirrors the "Set application version and environment" step of upstream's
      # theseus-build.yml. The tree only carries placeholder versions.
      sed -i "0,/^version = .*/s//version = \"$version\"/" apps/app/Cargo.toml packages/app-lib/Cargo.toml
      jq --arg version "$version" '.version = $version' apps/app-frontend/package.json > package.json.tmp
      mv package.json.tmp apps/app-frontend/package.json
      cp packages/app-lib/.env.prod packages/app-lib/.env

      export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
      export COREPACK_ENABLE_DOWNLOAD_PROMPT=0
      export CI=true
      mkdir -p "$CRAFT_PART_BUILD"/.corepack-bin
      /snap/node/current/bin/corepack enable --install-directory "$CRAFT_PART_BUILD"/.corepack-bin
      export PATH="$CRAFT_PART_BUILD/.corepack-bin:$PATH"
      pnpm install --frozen-lockfile

      # Building without upstream's tauri-release.conf.json leaves the "updater"
      # Cargo feature off. That's the supported way to disable it: the updater
      # plugin isn't compiled in, are_updates_enabled returns false, and the
      # frontend never shows any update UI.
      pnpm --filter=@modrinth/app run tauri build --bundles deb

      bin=target/release/ModrinthApp
      if grep -aq 'launcher-files.modrinth.com/updates.json' "$bin" \
        || grep -rq 'launcher-files.modrinth.com/updates.json' apps/app-frontend/dist; then
        echo "updater endpoint is still in the build"
        exit 1
      fi

      cp -a target/release/bundle/deb/*/data/usr "$CRAFT_PART_INSTALL"/
      # Rename desktop file — the space in the original name causes issues with
      # snapd's desktop file installation
      mv "$CRAFT_PART_INSTALL/usr/share/applications/Modrinth App.desktop" \
         "$CRAFT_PART_INSTALL/usr/share/applications/modrinth-app.desktop"
      # Patch icon to absolute snap path; snapd expands ${SNAP} in desktop files
      sed -i 's|^Icon=.*|Icon=${SNAP}/usr/share/icons/hicolor/256x256@2/apps/ModrinthApp.png|' \
         "$CRAFT_PART_INSTALL/usr/share/applications/modrinth-app.desktop"

  launcher:
    plugin: dump
    source: snap/local
    organize:
      launcher: bin/launcher
      xdg-open: bin/xdg-open
    stage:
      - bin/launcher
      - bin/xdg-open

apps:
  modrinth:
    command: usr/bin/ModrinthApp
    extensions: [gnome]
    command-chain:
      - bin/launcher
    desktop: usr/share/applications/modrinth-app.desktop
    environment:
      HOME: $SNAP_USER_COMMON
      TMPDIR: $XDG_RUNTIME_DIR
    plugs:
      - audio-playback
      - browser-support
      - home
      - network
      - network-bind
      - network-status
      - opengl
